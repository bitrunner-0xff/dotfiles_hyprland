general {
    hide_cursor = true
    fractional_scaling = false
    screencopy_mode = 0 # 0 - GPU; 1 - CPU (slow)
    text_trim = true
    immediate_render = false
    ignore_empty_input = false
}

background {
    monitor =
    path = $HOME/.config/hypr/images/2040972.jpg

    blur_size = 5
    blur_passes = 1 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb(198,208,245)
    font_size = 22
    font_family = JetBrainsMonoNL Nerd Font
    position = 0, 420
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgb(198,208,245)
    font_size = 90
    font_family = JetBrainsMonoNL Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# USER-NAME
label {
    monitor =
    text = $USER
    color = rgb(198,208,245)
    font_size = 20
    font_family = JetBrainsMonoNL Nerd Font
    position = 20, -60
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 350, 40
    rounding = 0
    outline_thickness = 1
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(125,207,255, 1)
    inner_color = rgba(26,27,38, 1)
    font_color = rgb(198,208,245)
    check_color = rgba(224,175,104, 1)
    fail_color = rgba(247,118,142, 1)
    fade_on_empty = false
    font_family = JetBrainsMonoNL Nerd Font
    placeholder_text = <i><span>Password...</span></i>
    hide_input = false
    rounding = 0
    position = 30, -125
    halign = center
    valign = center
}

